<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f4ef">
  <title>Estudiar Facil — Study room</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f4ef;
      --white: #fffefa;
      --ink: #20241f;
      --muted: #777c73;
      --line: #e6e6dc;
      --green: #264d3d;
      --green-2: #39715a;
      --lime: #d6f28a;
      --blue: #dceaf2;
      --red: #f8dfd6;
      --shadow: 0 18px 48px rgba(45, 54, 42, .08);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--paper); color: var(--ink); }
    button { font: inherit; color: inherit; cursor: pointer; }
    .app-shell { display: grid; grid-template-columns: 244px minmax(0, 1fr); min-height: 100vh; max-width: 1600px; margin: 0 auto; }
    .sidebar { padding: 26px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; background: rgba(255,255,255,.24); }
    .brand { display: flex; align-items: center; gap: 10px; padding: 0 10px; font-size: 18px; letter-spacing: -.06em; font-weight: 760; }
    .brand-mark { width: 30px; height: 30px; display: grid; place-items: center; background: var(--green); color: var(--lime); border-radius: 10px; font-size: 16px; letter-spacing: 0; }
    .side-label { margin: 48px 10px 12px; color: #96998e; font-size: 10px; letter-spacing: .13em; font-weight: 750; text-transform: uppercase; }
    .side-link, .deck-link { display: flex; gap: 11px; align-items: center; width: 100%; border: 0; background: transparent; padding: 11px 12px; text-align: left; border-radius: 10px; color: #62685e; font-size: 13px; }
    .side-link:hover, .deck-link:hover { background: #edeee5; }
    .side-link.active, .deck-link.active { background: #e6ebdf; color: var(--green); font-weight: 680; }
    .side-icon { width: 18px; text-align: center; font-size: 15px; }
    .deck-link { color: var(--ink); }
    .deck-art { width: 31px; height: 35px; flex: 0 0 auto; border-radius: 7px; background: #e4e9d9; display: grid; place-items: center; color: var(--green); font-size: 15px; }
    .deck-meta { min-width: 0; }
    .deck-title { display: block; font-size: 12px; line-height: 1.25; }
    .deck-count { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; font-weight: 450; }
    .streak-card { margin-top: auto; padding: 15px 14px; border: 1px solid var(--line); background: rgba(255,254,250,.7); border-radius: 13px; }
    .streak-top { display: flex; align-items: center; justify-content: space-between; font-size: 11px; font-weight: 700; }
    .streak-top span:last-child { color: #bd7244; font-size: 15px; }
    .streak-card p { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
    .main { min-width: 0; padding: 30px clamp(22px, 5vw, 70px) 50px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; max-width: 1040px; margin: 0 auto 45px; }
    .breadcrumb { color: var(--muted); font-size: 12px; }
    .breadcrumb strong { color: var(--ink); font-weight: 650; }
    .profile { width: 34px; height: 34px; border: 1px solid #e7e5da; background: #e5c9a9; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 750; color: #6b4e34; }
    .content { max-width: 850px; margin: 0 auto; }
    .eyebrow { color: var(--green-2); text-transform: uppercase; letter-spacing: .13em; font-size: 10px; font-weight: 780; }
    .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-size: clamp(34px, 5vw, 49px); font-weight: 500; letter-spacing: -.055em; line-height: 1.04; margin: 10px 0 9px; }
    .subtitle { color: var(--muted); font-size: 13px; margin: 0; }
    .title-art { width: 76px; height: 76px; display: grid; place-items: center; flex: 0 0 auto; background: var(--lime); color: var(--green); border-radius: 23px; font-size: 34px; transform: rotate(3deg); }
    .mode-tabs { display: flex; gap: 6px; margin: 34px 0 22px; border-bottom: 1px solid var(--line); }
    .mode-tab { position: relative; border: 0; background: transparent; padding: 0 15px 14px; color: #82867c; font-size: 12px; font-weight: 650; }
    .mode-tab:first-child { padding-left: 2px; }
    .mode-tab.active { color: var(--green); }
    .mode-tab.active::after { content: ""; position: absolute; bottom: -1px; left: 12px; right: 12px; height: 2px; background: var(--green); border-radius: 4px; }
    .mode-tab:first-child.active::after { left: 0; }
    .mode-tab .tab-icon { margin-right: 7px; font-size: 14px; }
    #mode-panel { min-height: 440px; }
    .panel-toolbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 20px 0 17px; }
    .toolbar-actions { display: inline-flex; align-items: center; gap: 8px; }
    .small-label { color: var(--muted); font-size: 11px; }
    .tool-button { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 34px; padding: 0 11px; color: #62685e; background: transparent; border: 1px solid var(--line); border-radius: 9px; font-size: 11px; font-weight: 620; }
    .tool-button:hover { border-color: #b9c6b4; color: var(--green); }
    .flashcard { position: relative; min-height: 310px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px 26px; text-align: center; border: 1px solid #ecebdf; border-radius: 19px; background: var(--white); box-shadow: var(--shadow); transition: transform .2s, background .2s; cursor: pointer; user-select: none; }
    .flashcard:hover { transform: translateY(-2px); }
    .flashcard.flipped { background: #f5f7ee; }
    .card-caption { color: #92968b; font-size: 10px; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; }
    .card-word { margin: 19px 0 14px; color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-weight: 500; letter-spacing: -.035em; font-size: clamp(25px, 4.2vw, 39px); line-height: 1.22; max-width: 680px; }
    .card-hint { color: #a4a69c; font-size: 11px; }
    .card-bottom { display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 19px; }
    .arrow-button { display: grid; place-items: center; width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; background: transparent; font-size: 15px; }
    .arrow-button:hover { background: white; }
    .card-position { min-width: 68px; color: #74796f; text-align: center; font-size: 11px; }
    .progress-track { height: 4px; overflow: hidden; background: #e8e9df; border-radius: 5px; }
    .progress-fill { height: 100%; background: #8ba77d; border-radius: inherit; transition: width .3s ease; }
    .progress-meta { display: flex; justify-content: space-between; margin-top: 9px; color: #898d83; font-size: 10px; }
    .learn-card, .challenge-card { border: 1px solid #e9e8dd; background: var(--white); border-radius: 18px; padding: clamp(22px, 4vw, 34px); box-shadow: var(--shadow); }
    .question-head { display: flex; justify-content: space-between; gap: 15px; color: var(--muted); font-size: 11px; }
    .question-head strong { color: var(--green); font-weight: 700; }
    .question { color: var(--ink); font-family: Georgia, "Times New Roman", serif; font-size: clamp(24px, 3.5vw, 33px); letter-spacing: -.035em; line-height: 1.2; margin: 25px 0 24px; }
    .question small { display: block; margin-bottom: 9px; color: #92968b; font: 700 10px/1.2 Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: .12em; text-transform: uppercase; }
    .answer-list { display: grid; gap: 9px; }
    .answer-option { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 10px 13px; text-align: left; border: 1px solid var(--line); background: white; border-radius: 10px; font-size: 13px; transition: .15s; }
    .answer-option:hover:not(:disabled) { background: #f8f9f4; border-color: #aab9a1; }
    .option-key { display: grid; place-items: center; flex: 0 0 25px; height: 25px; color: #777c73; background: #f1f1ea; border-radius: 7px; font-size: 10px; font-weight: 700; }
    .answer-option.correct { border-color: #88ad77; background: #f0f7e9; }
    .answer-option.correct .option-key { background: #cce5b8; color: #32552b; }
    .answer-option.incorrect { border-color: #dfa092; background: #fff4f0; }
    .answer-option.incorrect .option-key { background: #f2d0c5; color: #874a3a; }
    .feedback { min-height: 35px; padding-top: 13px; color: #6c7567; font-size: 11px; }
    .feedback.good { color: #3d7950; font-weight: 650; }
    .feedback.bad { color: #a15d49; }
    .primary-button { display: inline-flex; justify-content: center; align-items: center; gap: 8px; min-height: 43px; border: 0; border-radius: 10px; padding: 0 17px; color: white; background: var(--green); font-size: 12px; font-weight: 700; transition: background .15s, transform .15s; }
    .primary-button:hover { background: #32644f; transform: translateY(-1px); }
    .primary-button:disabled { cursor: default; opacity: .45; transform: none; }
    .secondary-button { min-height: 42px; padding: 0 15px; border: 1px solid var(--line); border-radius: 10px; background: white; font-size: 12px; font-weight: 650; }
    .learn-footer { display: flex; justify-content: flex-end; padding-top: 5px; }
    .complete-state { min-height: 345px; display: grid; place-items: center; text-align: center; padding: 30px; border-radius: 18px; background: var(--white); border: 1px solid var(--line); box-shadow: var(--shadow); }
    .complete-icon { display: grid; place-items: center; margin: 0 auto 17px; width: 55px; height: 55px; background: var(--lime); border-radius: 18px; font-size: 25px; }
    .complete-state h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 29px; font-weight: 500; letter-spacing: -.04em; }
    .complete-state p { margin: 0 0 21px; color: var(--muted); font-size: 12px; }
    .challenge-intro { padding: 25px 0 28px; text-align: center; }
    .timer-glyph { display: grid; place-items: center; margin: 0 auto 15px; width: 54px; height: 54px; background: #edf2e3; color: var(--green); border-radius: 17px; font-size: 22px; }
    .challenge-intro h2 { margin: 0 0 8px; font-family: Georgia, serif; font-size: 29px; font-weight: 500; letter-spacing: -.04em; }
    .challenge-intro p { max-width: 360px; margin: 0 auto; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .duration-label { margin: 22px 0 10px; color: #888d81; font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    .duration-picker { display: flex; gap: 8px; justify-content: center; }
    .duration-option { min-width: 72px; min-height: 39px; border: 1px solid var(--line); background: transparent; border-radius: 9px; color: #666c62; font-size: 12px; font-weight: 650; }
    .duration-option.selected { border-color: #89a27d; color: var(--green); background: #eff3e8; }
    .custom-time { display: inline-flex; align-items: center; gap: 7px; min-height: 39px; padding: 0 10px; border: 1px solid var(--line); border-radius: 9px; background: transparent; color: #666c62; font-size: 11px; }
    .custom-time.selected { border-color: #89a27d; color: var(--green); background: #eff3e8; }
    .custom-time input { width: 48px; padding: 3px 0; border: 0; outline: 0; background: transparent; color: inherit; font: 650 12px Inter, ui-sans-serif, system-ui, sans-serif; text-align: right; }
    .custom-time input::-webkit-inner-spin-button { opacity: .5; }
    .time-help { margin-top: 8px !important; font-size: 10px !important; }
    .challenge-settings { display: grid; gap: 14px; margin: 21px auto 0; max-width: 425px; }
    .setting-label { display: block; margin-bottom: 8px; color: #888d81; font-size: 10px; font-weight: 750; letter-spacing: .1em; text-align: left; text-transform: uppercase; }
    .answer-mode-picker { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
    .answer-mode-option { min-height: 38px; border: 1px solid var(--line); background: transparent; border-radius: 9px; color: #666c62; font-size: 11px; font-weight: 650; }
    .answer-mode-option.selected { border-color: #89a27d; color: var(--green); background: #eff3e8; }
    .relaxed-setting { display: flex; align-items: center; gap: 10px; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; text-align: left; cursor: pointer; }
    .relaxed-setting input { position: absolute; opacity: 0; pointer-events: none; }
    .toggle-track { position: relative; width: 34px; height: 19px; flex: 0 0 auto; background: #dfe1d7; border-radius: 20px; transition: background .15s; }
    .toggle-track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 13px; height: 13px; background: white; border-radius: 50%; box-shadow: 0 1px 3px #0002; transition: transform .15s; }
    .relaxed-setting input:checked + .toggle-track { background: #6e9664; }
    .relaxed-setting input:checked + .toggle-track::after { transform: translateX(15px); }
    .relaxed-copy strong { display: block; color: #495046; font-size: 11px; }
    .relaxed-copy small { display: block; margin-top: 3px; color: #858a80; font-size: 10px; }
    .typed-answer { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
    .typed-answer input { min-width: 0; min-height: 49px; padding: 0 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff !important; color: #20241f !important; caret-color: #264d3d !important; opacity: 1 !important; -webkit-text-fill-color: #20241f !important; font: 13px Inter, ui-sans-serif, system-ui, sans-serif; }
    .typed-answer input::placeholder { color: #697166 !important; opacity: 1 !important; -webkit-text-fill-color: #697166 !important; }
    .typed-entry { min-width: 0; min-height: 49px; overflow: auto; padding: 13px; border: 1px solid var(--line); border-radius: 10px; outline: none; background: #fff !important; color: #20241f !important; caret-color: #264d3d !important; font: 13px Inter, ui-sans-serif, system-ui, sans-serif; line-height: 1.35; text-align: left; }
    .typed-entry:empty::before { content: attr(data-placeholder); color: #697166 !important; opacity: 1; pointer-events: none; }
    .typed-entry:focus { border-color: #89a27d; box-shadow: 0 0 0 3px #89a27d22; }
    .typed-entry[contenteditable="false"] { background: #f5f5f0 !important; }
    .typed-preview { min-height: 25px; margin-top: 8px; padding: 7px 10px; color: #20241f !important; background: #f4f6ee; border-radius: 7px; font-size: 11px; line-height: 1.35; text-align: left; }
    .typed-preview.empty { color: #697166 !important; }
    .typed-answer input:focus { border-color: #89a27d; box-shadow: 0 0 0 3px #89a27d22; }
    .typed-answer input:disabled { background: #f5f5f0; }
    .challenge-start { display: flex; justify-content: center; margin-top: 21px; }
    .challenge-live-top { display: flex; justify-content: space-between; align-items: center; padding: 3px 0 16px; }
    .timer-pill { display: inline-flex; gap: 7px; align-items: center; border-radius: 20px; background: #eff2e8; padding: 8px 12px; color: var(--green); font-size: 12px; font-weight: 750; font-variant-numeric: tabular-nums; }
    .timer-pill.urgent { background: #fff0e9; color: #a45136; }
    .score-label { color: var(--muted); font-size: 11px; }
    .score-label strong { color: var(--ink); font-size: 14px; margin-left: 4px; }
    .challenge-question { min-height: 180px; display: flex; flex-direction: column; justify-content: center; text-align: center; padding: 13px; border-radius: 13px; background: #f5f6ef; margin: 3px 0 17px; }
    .challenge-question .question { margin: 9px 0; }
    .challenge-question .question small { margin: 0; }
    .challenge-bottom { margin-top: 12px; min-height: 16px; color: #84897f; font-size: 10px; text-align: center; }
    .challenge-answer-reveal { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; padding: 12px 14px; border: 1px solid #d7e7cc; border-radius: 10px; color: #315c3f; background: #eff7e9; animation: reveal-in .14s ease-out; }
    .challenge-answer-reveal.miss { border-color: #efc6b9; color: #8a4935; background: #fff1eb; }
    .challenge-answer-reveal[hidden] { display: none; }
    .challenge-answer-reveal span { font-size: 9px; font-weight: 780; letter-spacing: .1em; text-transform: uppercase; }
    .challenge-answer-reveal strong { font-family: Georgia, "Times New Roman", serif; font-size: 18px; line-height: 1.25; font-weight: 600; }
    .challenge-mode-toolbar { display: flex; justify-content: flex-end; margin: -12px 0 3px; }
    @keyframes reveal-in { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: translateY(0); } }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) { display: flex; width: 100vw; min-height: 100vh; padding: clamp(24px, 5vh, 64px) clamp(24px, 6vw, 96px); flex-direction: column; justify-content: center; align-items: center; gap: clamp(18px, 3vh, 32px); overflow: auto; background: var(--paper); }
    body.study-fullscreen { overflow: hidden; }
    #mode-panel.fullscreen-mode { position: fixed; inset: 0; z-index: 9999; width: 100vw; height: 100vh; min-height: 100vh; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) > * { width: 100%; max-width: 1280px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .panel-toolbar { margin-top: 0; font-size: 14px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .small-label { font-size: 13px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .tool-button { min-height: 44px; padding: 0 15px; font-size: 13px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .flashcard { width: 100%; min-height: min(62vh, 720px); padding: clamp(42px, 7vh, 84px); border-radius: 26px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .card-caption { font-size: 12px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .card-word { max-width: 1000px; font-size: clamp(38px, 5.2vw, 72px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .card-hint, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .card-position { font-size: 13px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .arrow-button { width: 48px; height: 48px; font-size: 20px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .learn-card, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-card { width: 100%; max-width: 1080px; margin-left: auto; margin-right: auto; padding: clamp(32px, 5vw, 66px); border-radius: 24px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .question { font-size: clamp(34px, 4.2vw, 56px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .question small, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .question-head, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .setting-label { font-size: 13px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .answer-option { min-height: clamp(62px, 8vh, 82px); padding: 14px 18px; border-radius: 13px; font-size: clamp(15px, 1.5vw, 20px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .option-key { width: 32px; height: 32px; flex-basis: 32px; font-size: 13px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-question { min-height: min(34vh, 340px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .typed-answer input { min-height: 64px; padding: 0 18px; font-size: 18px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .typed-answer .primary-button, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .primary-button { min-height: 54px; padding: 0 22px; font-size: 15px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-answer-reveal { padding: 18px 22px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-answer-reveal span { font-size: 11px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-answer-reveal strong { font-size: clamp(23px, 2.6vw, 34px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .complete-state { min-height: min(70vh, 760px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .complete-state h2, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-intro h2 { font-size: clamp(38px, 4vw, 54px); }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-intro p, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .complete-state p { font-size: 15px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .duration-option, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .answer-mode-option { min-height: 48px; padding: 0 16px; font-size: 14px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .timer-pill, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .score-label { font-size: 15px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .timer-pill { padding: 11px 16px; }
    :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .summary-score { font-size: clamp(76px, 9vw, 120px); }
    @media (max-width: 760px) {
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) { padding: 20px 14px; gap: 14px; }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .learn-card, :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-card { padding: 22px 16px; }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .flashcard { min-height: 58vh; padding: 30px 18px; }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .card-word { font-size: clamp(30px, 8vw, 48px); }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .question { font-size: clamp(27px, 7vw, 39px); }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-live-top { gap: 7px; }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .challenge-live-top .tool-button { padding: 0 8px; font-size: 11px; }
      :is(#mode-panel:fullscreen, #mode-panel.fullscreen-mode) .answer-option { min-height: 56px; font-size: 14px; }
    }
    .challenge-summary { text-align: center; padding: 28px 10px 25px; }

          ${isTyped ? `<form class="typed-answer" id="learn-typed-form"><input id="learn-typed-input" type="text" style="color:#20241f!important;background:#fff!important;-webkit-text-fill-color:#20241f!important;opacity:1!important" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type your answer in Spanish…" aria-label="Type your answer in Spanish"><button class="primary-button" type="submit">Check ↵</button></form><div class="typed-preview empty" id="learn-typed-preview">Your answer will appear here</div><label class="relaxed-setting" style="margin-top:12px"><input id="learn-relaxed-toggle" type="checkbox" ${learnRelaxed ? 'checked' : ''}><span class="toggle-track" aria-hidden="true"></span><span class="relaxed-copy"><strong>Relaxed answers</strong><small>Allow accents, small typos, and a minor omitted word</small></span></label>` : `<div class="answer-list">${options.map((option, n) => `<button class="answer-option" data-option="${option}" type="button"><span class="option-key">${String.fromCharCode(65 + n)}</span><span>${escapeHtml(terms[option].es)}</span></button>`).join('')}</div>`}
          <div class="feedback" id="learn-feedback">${isTyped ? 'Type your answer, then check it.' : 'Select an answer to see how you did.'}</div>
          <div class="learn-footer"><button class="primary-button" id="learn-continue" type="button" disabled>Continue →</button></div>
        </div>`;
      panel.querySelectorAll('.answer-option').forEach(button => button.addEventListener('click', () => answerLearnChoice(Number(button.dataset.option), index)));
      document.getElementById('learn-typed-form')?.addEventListener('submit', event => {
        event.preventDefault();
        answerLearnTyped(document.getElementById('learn-typed-input').value, index);
      });
      document.getElementById('learn-typed-input')?.addEventListener('input', event => updateTypedPreview(event.target, 'learn-typed-preview'));
      document.getElementById('learn-relaxed-toggle')?.addEventListener('change', event => { learnRelaxed = event.target.checked; });
      document.getElementById('learn-continue').addEventListener('click', advanceLearn);
      attachFullscreenButton();
    }
    function answerLearnChoice(choice, correctIndex) {
      if (learnAnswered) return;
      learnAnswered = true;
      learnChoice = choice;
      const correct = choice === correctIndex;
      if (!correct) learnPracticeQueue.push(correctIndex);
      panel.querySelectorAll('.answer-option').forEach(button => {
        const option = Number(button.dataset.option);
        button.disabled = true;
        if (option === correctIndex) button.classList.add('correct');
        else if (option === choice) button.classList.add('incorrect');
      });
      const feedback = document.getElementById('learn-feedback');
      feedback.className = `feedback ${correct ? 'good' : 'bad'}`;
      feedback.textContent = correct ? 'Correct — you’ll type this one in a moment.' : `Not quite. The answer is “${terms[correctIndex].es}”. We’ll circle back to this one.`;
      scheduleLearnAdvance(correct);
    }
    function answerLearnTyped(response, correctIndex) {
      if (learnAnswered || !response.trim()) return;
      learnAnswered = true;
      const correct = isChallengeAnswerCorrect(response, terms[correctIndex].es, learnRelaxed);
      if (correct) learnMastered.add(correctIndex);
      else learnPracticeQueue.push(correctIndex);
      const input = document.getElementById('learn-typed-input');
      input.disabled = true;
      const submit = panel.querySelector('.typed-answer button');
      submit.disabled = true;
      const feedback = document.getElementById('learn-feedback');
      feedback.className = `feedback ${correct ? 'good' : 'bad'}`;
      feedback.textContent = correct ? 'Correct — that term is mastered.' : `Not quite. The answer is “${terms[correctIndex].es}”. You’ll type it again before moving on.`;
      scheduleLearnAdvance(correct);
    }
    function scheduleLearnAdvance(correct) {
      const continueButton = document.getElementById('learn-continue');
      if (!correct) {
        continueButton.disabled = false;
        return;
      }
      continueButton.textContent = 'Next →';
      clearTimeout(learnTimeout);
      learnTimeout = setTimeout(advanceLearn, 500);
    }
    function advanceLearn() {
      if (!learnAnswered) return;
      clearTimeout(learnTimeout);
      learnPracticeQueue.shift();
      renderLearn();
    }
    function renderChallenge() {
      document.getElementById('keyboard-hint').textContent = challengeAnswerMode === 'typed' ? 'Type your answer in Spanish' : 'Choose the best Spanish answer';
      if (!challengeActive) {
        if (challengeEnded) {
          panel.innerHTML = `<div class="challenge-card"><div class="challenge-mode-toolbar"><button class="tool-button" id="fullscreen-button" type="button">⛶ Full screen</button></div><div class="challenge-summary"><div class="complete-icon">✦</div><div class="eyebrow">Round complete</div><div class="summary-score">${challengeScore}</div><div class="summary-caption">correct answers in ${challengeLength} seconds</div><div class="summary-stats"><div><strong>${challengeAttempts}</strong><span>answered</span></div><div><strong>${challengeAttempts ? Math.round(challengeScore / challengeAttempts * 100) : 0}%</strong><span>accuracy</span></div><div><strong>${challengeBestStreak}</strong><span>best streak</span></div></div><button class="primary-button" id="play-again">Play again ↗</button></div></div>`;
          document.getElementById('play-again').addEventListener('click', () => { challengeEnded = false; renderChallenge(); });
          attachFullscreenButton();
          return;
        }
        const isCustomTime = ![30, 60, 90].includes(challengeLength);
        panel.innerHTML = `<div class="challenge-card"><div class="challenge-mode-toolbar"><button class="tool-button" id="fullscreen-button" type="button">⛶ Full screen</button></div><div class="challenge-intro"><div class="timer-glyph">◷</div><h2>Beat the clock.</h2><p>Answer as many identity questions as you can before time runs out. Each correct answer adds to your score.</p>
          <div class="duration-label">Choose your time</div>
          <div class="duration-picker" role="group" aria-label="Challenge duration">
            ${[30, 60, 90].map(seconds => `<button class="duration-option ${challengeLength === seconds ? 'selected' : ''}" data-duration="${seconds}" type="button">${seconds} sec</button>`).join('')}
            <label class="custom-time ${isCustomTime ? 'selected' : ''}" id="custom-time-label"><input id="custom-seconds" type="number" min="10" max="3600" step="5" value="${challengeCustomSeconds}" aria-label="Custom time in seconds"><span>sec</span></label>
          </div><p class="time-help">Custom time: 10–3600 seconds</p>
          <div class="challenge-settings">
            <div><span class="setting-label">How do you want to answer?</span><div class="answer-mode-picker" role="group" aria-label="Answer style">
              <button class="answer-mode-option ${challengeAnswerMode === 'choice' ? 'selected' : ''}" data-answer-mode="choice" type="button">Multiple choice</button>
              <button class="answer-mode-option ${challengeAnswerMode === 'typed' ? 'selected' : ''}" data-answer-mode="typed" type="button">Type it</button>
            </div></div>
            ${challengeAnswerMode === 'typed' ? `<label class="relaxed-setting"><input id="relaxed-toggle" type="checkbox" ${challengeRelaxed ? 'checked' : ''}><span class="toggle-track" aria-hidden="true"></span><span class="relaxed-copy"><strong>Relaxed answers</strong><small>Allow accents, small typos, and a minor omitted word</small></span></label>` : ''}
          </div>
          <div class="challenge-start"><button class="primary-button" id="start-challenge">Start challenge&nbsp; →</button></div></div></div>`;
        panel.querySelectorAll('[data-duration]').forEach(button => button.addEventListener('click', () => { challengeLength = Number(button.dataset.duration); renderChallenge(); }));
        panel.querySelectorAll('[data-answer-mode]').forEach(button => button.addEventListener('click', () => { challengeAnswerMode = button.dataset.answerMode; renderChallenge(); }));
        const customInput = document.getElementById('custom-seconds');
        document.getElementById('custom-time-label').addEventListener('click', () => {
          challengeLength = challengeCustomSeconds;
          document.querySelectorAll('.duration-option').forEach(button => button.classList.remove('selected'));
          document.getElementById('custom-time-label').classList.add('selected');
        });
        customInput.addEventListener('input', () => {
          challengeCustomSeconds = Math.min(3600, Math.max(10, Number(customInput.value) || 10));
          challengeLength = challengeCustomSeconds;
          document.querySelectorAll('.duration-option').forEach(button => button.classList.remove('selected'));
          document.getElementById('custom-time-label').classList.add('selected');
        });
        customInput.addEventListener('change', () => {
          customInput.value = challengeCustomSeconds;
          challengeLength = challengeCustomSeconds;
        });
        document.getElementById('relaxed-toggle')?.addEventListener('change', event => { challengeRelaxed = event.target.checked; });
        document.getElementById('start-challenge').addEventListener('click', startChallenge);
        attachFullscreenButton();
        return;
      }
      const index = challengeQuestion;
      const options = randomOptions(index);
      const answerArea = challengeAnswerMode === 'typed'
        ? `<form class="typed-answer" id="typed-answer-form"><div id="typed-answer-input" class="typed-entry" contenteditable="true" role="textbox" aria-label="Type your answer in Spanish" data-placeholder="Type your answer in Spanish…"></div><button class="primary-button" type="submit">Check ↵</button></form><div class="typed-preview empty" id="typed-answer-preview">Your answer will appear here</div>`
        : `<div class="answer-list">${options.map((option, n) => `<button class="answer-option" data-option="${option}" type="button"><span class="option-key">${String.fromCharCode(65 + n)}</span><span>${escapeHtml(terms[option].es)}</span></button>`).join('')}</div>`;
      panel.innerHTML = `<div class="challenge-card">
        <div class="challenge-live-top"><div class="timer-pill ${challengeTime <= 10 ? 'urgent' : ''}" id="timer-pill">◷ <span>${formatTime(challengeTime)}</span></div><div class="score-label">${challengeAttempts ? Math.round(challengeScore / challengeAttempts * 100) : 0}% accuracy <strong>${challengeScore} / ${challengeAttempts}</strong></div><button class="tool-button" id="fullscreen-button" type="button">⛶ Full screen</button></div>
        <div class="progress-track"><div class="progress-fill" style="width:${Math.max(0, challengeTime / challengeLength * 100)}%"></div></div>
        <div class="challenge-question"><div class="question"><small>What does this mean?</small>${escapeHtml(terms[index].en)}</div></div>
        ${answerArea}
        <div class="challenge-answer-reveal" id="challenge-reveal" aria-live="polite" hidden></div>
        <div class="challenge-bottom" id="challenge-feedback">Question ${challengeAttempts + 1} · Keep your streak alive</div>
      </div>`;
      panel.querySelectorAll('.answer-option').forEach(button => button.addEventListener('click', () => answerChallenge(Number(button.dataset.option), index)));
      document.getElementById('typed-answer-form')?.addEventListener('submit', event => {
        event.preventDefault();
        answerTypedChallenge(document.getElementById('typed-answer-input').textContent, index);
      });
      document.getElementById('typed-answer-input')?.addEventListener('input', event => updateTypedPreview(event.target, 'typed-answer-preview'));
      document.getElementById('typed-answer-input')?.addEventListener('keydown', event => {
        if (event.key === 'Enter') { event.preventDefault(); document.getElementById('typed-answer-form').requestSubmit(); }
      });
      attachFullscreenButton();
    }
    function startChallenge() {
      challengeActive = true;
      challengeEnded = false;
      challengeTime = challengeLength;
      challengeScore = 0;
      challengeAttempts = 0;
      challengeStreak = 0;
      challengeBestStreak = 0;
      challengeDeck = shuffle(terms.map((_, i) => i));
      challengeQuestion = challengeDeck.shift();
      challengeChoice = null;
      renderChallenge();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!challengeActive) return;
        if (challengeTime > 0) challengeTime -= 1;
        const pill = document.getElementById('timer-pill');
        if (pill) {
          pill.querySelector('span').textContent = formatTime(challengeTime);
          pill.classList.toggle('urgent', challengeTime <= 10);
        }
        const fill = panel.querySelector('.progress-fill');
        if (fill) fill.style.width = `${Math.max(0, challengeTime / challengeLength * 100)}%`;
        if (challengeTime <= 0 && challengeChoice === null) endChallenge();
      }, 1000);
    }
    function answerChallenge(choice, correctIndex) {
      if (!challengeActive || challengeTime <= 0 || challengeChoice !== null) return;
      const correct = choice === correctIndex;
      challengeChoice = choice;
      challengeAttempts += 1;
      if (correct) {
        challengeScore += 1;
        challengeStreak += 1;
        challengeBestStreak = Math.max(challengeBestStreak, challengeStreak);
      } else challengeStreak = 0;
      panel.querySelectorAll('.answer-option').forEach(button => {
        const option = Number(button.dataset.option);
        button.disabled = true;
        if (option === correctIndex) button.classList.add('correct');
        else if (option === choice) button.classList.add('incorrect');
      });
      const feedback = document.getElementById('challenge-feedback');
      if (feedback) feedback.textContent = correct ? `Correct · ${challengeStreak} in a row` : 'Take a moment to read the correct answer.';
      revealChallengeAnswer(correctIndex, correct);
      scheduleNextChallenge(correct);
    }
    function answerTypedChallenge(response, correctIndex) {
      if (!challengeActive || challengeTime <= 0 || challengeChoice !== null || !response.trim()) return;
      const correct = isChallengeAnswerCorrect(response, terms[correctIndex].es, challengeRelaxed);
      challengeChoice = response;
      challengeAttempts += 1;
      if (correct) {
        challengeScore += 1;
        challengeStreak += 1;
        challengeBestStreak = Math.max(challengeBestStreak, challengeStreak);
      } else challengeStreak = 0;
      const input = document.getElementById('typed-answer-input');
      const submit = panel.querySelector('.typed-answer button');
      input.setAttribute('contenteditable', 'false');
      submit.disabled = true;
      const feedback = document.getElementById('challenge-feedback');
      feedback.textContent = correct
        ? `Correct · ${challengeStreak} in a row`
        : 'Take a moment to read the correct answer.';
      feedback.style.color = correct ? '#3d7950' : '#a15d49';
      revealChallengeAnswer(correctIndex, correct);
      scheduleNextChallenge(correct);
    }
    function revealChallengeAnswer(correctIndex, correct) {
      const reveal = document.getElementById('challenge-reveal');
      reveal.className = `challenge-answer-reveal ${correct ? '' : 'miss'}`;
      reveal.innerHTML = `<span>${correct ? 'Correct answer' : 'Correct answer · read and remember'}</span><strong>${escapeHtml(terms[correctIndex].es)}</strong>`;
      reveal.hidden = false;
    }
    function scheduleNextChallenge(correct) {
      clearTimeout(challengeTimeout);
      challengeTimeout = setTimeout(() => {
        if (!challengeActive) return;
        challengeChoice = null;
        if (challengeTime <= 0) { endChallenge(); return; }
        if (challengeDeck.length === 0) {
          challengeDeck = shuffle(terms.map((_, i) => i));
          if (challengeDeck[0] === challengeQuestion) [challengeDeck[0], challengeDeck[1]] = [challengeDeck[1], challengeDeck[0]];
        }
        challengeQuestion = challengeDeck.shift();
        renderChallenge();
      }, correct ? 500 : 1000);
    }
    function answerVariants(value) {
      const variants = [value, ...value.split(/\s*[,;]\s*|\s+\/\s+/g), ...(value.match(/¿[^?]+\?/g) || [])];
      for (const variant of [...variants]) {
        const gendered = variant.trim().match(/^(.*)\/a$/);
        if (gendered) {
          const masculine = gendered[1].trim();
          variants.push(masculine, masculine.endsWith('o') ? `${masculine.slice(0, -1)}a` : `${masculine}a`);
        }
      }
      if (/¿cuánto\/a\/os\/as\?/i.test(value)) variants.push('¿Cuánto?', '¿Cuánta?', '¿Cuántos?', '¿Cuántas?');
      return [...new Set(variants.map(item => item.trim()).filter(Boolean))];
    }
    function strictNormalize(value) {
      return String(value).normalize('NFC').toLocaleLowerCase('es').replace(/[¿?¡!.,;:'"()]/g, '').replace(/\s+/g, ' ').trim();
    }
    function relaxedNormalize(value) {
      return strictNormalize(String(value).replace(/\([^)]*\)/g, ' ')).normalize('NFD').replace(/[\u0300-\u036f]/g, '');
    }
    function editDistance(a, b) {
      const row = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let diagonal = row[0];
        row[0] = i;
        for (let j = 1; j <= b.length; j++) {
          const above = row[j];
          row[j] = Math.min(row[j] + 1, row[j - 1] + 1, diagonal + (a[i - 1] === b[j - 1] ? 0 : 1));
          diagonal = above;
        }
      }
      return row[b.length];
    }
    function isChallengeAnswerCorrect(response, expected, relaxed) {
      const variants = answerVariants(expected);
      const normalizedResponse = strictNormalize(response);
      if (variants.some(variant => normalizedResponse === strictNormalize(variant))) return true;
      if (!relaxed) return false;
      const foldedResponse = relaxedNormalize(response);
      for (const variant of variants) {
        const foldedExpected = relaxedNormalize(variant);
        const maxTypos = Math.max(1, Math.floor(foldedExpected.length * .08));
        if (Math.abs(foldedResponse.length - foldedExpected.length) <= maxTypos && editDistance(foldedResponse, foldedExpected) <= maxTypos) return true;
        const expectedWords = foldedExpected.split(' ').filter(Boolean);
        const responseWords = foldedResponse.split(' ').filter(Boolean);
        if (expectedWords.length >= 5 && Math.abs(expectedWords.length - responseWords.length) <= 1) {
          const availableWords = [...responseWords];
          const matched = expectedWords.filter(word => {
            const matchIndex = availableWords.findIndex(candidate => {
            const allowed = word.length >= 5 ? 1 : 0;
            return Math.abs(word.length - candidate.length) <= allowed && editDistance(word, candidate) <= allowed;
            });
            if (matchIndex >= 0) availableWords.splice(matchIndex, 1);
            return matchIndex >= 0;
          }).length;
          if (matched >= Math.ceil(expectedWords.length * .8)) return true;
        }
      }
      return false;
    }
    function endChallenge() {
      challengeActive = false;
      challengeEnded = true;
      clearInterval(timerInterval);
      clearTimeout(challengeTimeout);
      renderChallenge();
    }
    function stopChallenge() {
      challengeActive = false;
      clearInterval(timerInterval);
      clearTimeout(challengeTimeout);
      challengeChoice = null;
    }
    function syncFullscreenButton() {
      const button = document.getElementById('fullscreen-button');
      if (document.fullscreenElement === panel) nativeFullscreenActive = true;
      else if (nativeFullscreenActive) {
        nativeFullscreenActive = false;
        panel.classList.remove('fullscreen-mode');
        document.body.classList.remove('study-fullscreen');
      }
      if (!button) return;
      const isFullscreen = document.fullscreenElement === panel || panel.classList.contains('fullscreen-mode');
      button.textContent = isFullscreen ? '⛶ Exit full screen' : '⛶ Full screen';
      button.setAttribute('aria-label', isFullscreen ? 'Exit full screen' : 'Enter full screen');
    }
    function attachFullscreenButton() {
      const button = document.getElementById('fullscreen-button');
      if (!button) return;
      button.addEventListener('click', async () => {
        const alreadyFullscreen = document.fullscreenElement === panel || panel.classList.contains('fullscreen-mode');
        if (alreadyFullscreen) {
          if (document.fullscreenElement === panel && document.exitFullscreen) {
            try { await document.exitFullscreen(); } catch (error) { /* Keep the viewport fallback available. */ }
          }
          panel.classList.remove('fullscreen-mode');
          document.body.classList.remove('study-fullscreen');
          syncFullscreenButton();
          return;
        }
        panel.classList.add('fullscreen-mode');
        document.body.classList.add('study-fullscreen');
        syncFullscreenButton();
        try {
          if (panel.requestFullscreen) await panel.requestFullscreen();
        } catch (error) {
          // The page-level fullscreen presentation remains active if native fullscreen is unavailable.
        }
        syncFullscreenButton();
      });
      syncFullscreenButton();
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char])); }
    function updateTypedPreview(input, previewId) {
      const preview = document.getElementById(previewId);
      if (!preview) return;
      const value = (typeof input.value === 'string' ? input.value : input.textContent).trim();
      preview.textContent = value || 'Your answer will appear here';
      preview.classList.toggle('empty', !value);
    }

    document.addEventListener('fullscreenchange', syncFullscreenButton);
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape' && !document.fullscreenElement && panel.classList.contains('fullscreen-mode')) {
        panel.classList.remove('fullscreen-mode');
        document.body.classList.remove('study-fullscreen');
        syncFullscreenButton();
      }
    });
    modeTabs.forEach(tab => tab.addEventListener('click', () => setMode(tab.dataset.mode)));
    document.getElementById('deck-u1').addEventListener('click', () => selectDeck('u1'));
    document.getElementById('deck-u2').addEventListener('click', () => selectDeck('u2'));
    document.getElementById('deck-u3').addEventListener('click', () => selectDeck('u3'));
    document.addEventListener('keydown', event => {
      if (mode !== 'flash' || /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
      if (event.key === 'ArrowLeft') moveFlash(-1);
      if (event.key === 'ArrowRight') moveFlash(1);
      if (event.code === 'Space' && document.activeElement.tagName !== 'BUTTON') { event.preventDefault(); flipCard(); }
    });
    render();
  </script>
